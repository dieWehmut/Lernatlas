name: Sync Vorlage template styles

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [template-styles-updated]

permissions:
  contents: write
  actions: write

concurrency:
  group: template-style-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYNC_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test synchronization boundaries offline
        run: node --test scripts/test-template-styles.mjs
      - name: Detect upstream SHA and synchronize approved styles
        id: sync
        run: node scripts/sync-template-styles.mjs
      - name: Setup pnpm
        if: steps.sync.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test local site contracts
        if: steps.sync.outputs.changed == 'true'
        run: pnpm run check
      - name: Build and verify synchronized styles
        if: steps.sync.outputs.changed == 'true'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm run build
          pnpm run verify:build
      - name: Commit and push only synchronized files
        id: commit
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_PATHS: ${{ steps.sync.outputs.paths }}
          SOURCE_COMMIT: ${{ steps.sync.outputs.source_commit }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { assertManagedPath, LOCK_PATH } from './scripts/sync-template-styles.mjs'
          const paths = JSON.parse(process.env.SYNC_PATHS)
          if (!Array.isArray(paths) || paths.length === 0) throw new Error('Expected synchronized paths')
          for (const path of paths) if (path !== LOCK_PATH) assertManagedPath(path)
          execFileSync('git', ['add', '--', ...paths], { stdio: 'inherit' })
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m "chore: sync Vorlage styles at ${SOURCE_COMMIT:0:12}"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes cannot trigger the push-based Pages workflow.
      # workflow_dispatch is an explicit exception, with actions:write above.
      - name: Dispatch Pages deployment for the updated default branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
