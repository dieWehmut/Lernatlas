name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set deployment path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          user_site="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          if [[ "${repo_name,,}" == "$user_site" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: pnpm run build
      - name: Verify static build
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { existsSync, readFileSync } from 'node:fs'
          import path from 'node:path'

          const base = process.env.BASE_PATH
          assert.ok(base?.startsWith('/') && base.endsWith('/'), 'BASE_PATH must be absolute with a trailing slash')
          const html = readFileSync('dist/index.html', 'utf8')
          assert.equal(readFileSync('dist/404.html', 'utf8'), html, 'Missing SPA fallback')
          const localAssets = [...html.matchAll(/(?:src|href)="([^"]+)"/g)]
            .map((match) => match[1])
            .filter((url) => !/^(?:[a-z]+:|\/\/|#)/i.test(url))
          assert.ok(localAssets.length > 0, 'No static entry assets found')
          for (const url of localAssets) {
            assert.ok(url.startsWith(base), `Asset does not use the deployment path: ${url}`)
            const relativePath = decodeURIComponent(url.slice(base.length).split(/[?#]/)[0])
            assert.ok(existsSync(path.join('dist', relativePath)), `Missing static asset: ${url}`)
          }
          console.log(`Verified ${localAssets.length} entry assets and the 404 fallback at ${base}`)
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
