name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test learning site contracts
        run: pnpm test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set deployment path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          user_site="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          if [[ "${repo_name,,}" == "$user_site" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: pnpm run build
      - name: Verify static build
        run: pnpm run verify:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Wait for the pages artifact to register
        shell: bash
        run: |
          # deploy-pages lists artifacts through the actions-results Twirp
          # service, which can lag behind the finalized upload. Poll that same
          # service (not the REST API, which is a different surface) before
          # handing over to the deploy step.
          sleep 10
          origin=$(printf '%s' "${ACTIONS_RESULTS_URL}" | cut -d/ -f1-3)
          url="${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts"
          for attempt in $(seq 1 20); do
            body=$(curl -sS -m 10 -X POST "$url" \
              -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              -H "Content-Type: application/json" -d '{}' 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'github-pages'; then
              echo "pages artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "pages artifact still not visible; continuing so the deploy attempt can report it"
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
