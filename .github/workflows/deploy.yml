name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test learning site contracts
        run: pnpm test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set deployment path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          user_site="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          if [[ "${repo_name,,}" == "$user_site" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: pnpm run build
      - name: Verify static build
        run: pnpm run verify:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the pages artifact to register
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # deploy-pages reads the run's artifact list immediately after the
          # upload step, and that list can lag behind the finalized zip. Poll
          # until the artifact is visible so the deploy step has something to
          # resolve.
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')
            if [ "${count:-0}" -gt 0 ]; then
              echo "pages artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "pages artifact never became visible" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
